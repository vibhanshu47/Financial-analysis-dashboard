<html>
<head>
    <title>AI Trading Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        /* New styles for the search bar */
        .search-box { margin: 20px 0; padding: 20px; background: #e8f4f8; border-radius: 8px; text-align: center; }
        input[type="text"] { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        .error { color: red; font-weight: bold; text-align: center; margin-top: 10px; }

        .chart-container { text-align: center; margin-top: 20px; }
        img { max-width: 100%; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Sector Analysis</h1>
        <p>Real-time pattern recognition and algorithmic crossover detection mapping momentum shifts.</p>
        
        <!-- THE NEW SEARCH BAR -->
        <div class="search-box">
            <form method="POST">
                <input type="text" name="ticker" placeholder="Enter NSE Ticker (e.g., RELIANCE.NS)" required>
                <button type="submit">Analyze Stock</button>
            </form>
        </div>

        <!-- ERROR MESSAGE (If they type a fake stock) -->
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <!-- THE GRAPH -->
        {% if plot_url %}
        <div class="chart-container">
            <img src="data:image/png;base64,{{ plot_url }}" alt="Trading Chart">
        </div>
        <div style="text-align: center; margin-top: 15px; color: #7f8c8d;">
            Currently analyzing: <strong>{{ current_ticker }}</strong>
        </div>
        {% endif %}

    </div>
</body>
</html>
